name: Plugin Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-static-gate:
    name: Repository static gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest packaging

      - name: Validate repository metadata
        run: python scripts/validate_repo.py

      - name: Validate V3 dependency manifests
        run: python scripts/check_v3_dependency_install.py --static-only

      - name: Compile V3 plugins
        shell: bash
        run: |
          set -euo pipefail
          find plugins.v3 -name '*.py' -print0 | xargs -0 -r -n1 python -m py_compile

      - name: Run repository tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

      - name: Build and validate V3 Release archives
        run: python scripts/build_release.py --output dist/releases

      - name: Re-validate every generated Release archive
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r archive; do
            file_name="$(basename "$archive" .zip)"
            plugin_id="${file_name%_v*}"
            version="${file_name##*_v}"
            python scripts/validate_release.py "$archive" "$plugin_id" --version "$version"
          done < <(find dist/releases -maxdepth 1 -type f -name '*.zip' -print | sort)

      - name: Upload validated Release archives
        uses: actions/upload-artifact@v4
        with:
          name: moviepilot-v3-releases-${{ github.sha }}
          path: dist/releases/*.zip
          if-no-files-found: error

  dependency-install-gate:
    name: V3 dependency resolution
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: 3.14
          - os: windows-latest
            python: 3.14
          - os: macos-14
            python: 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Resolve V3 dependencies without modifying the runner environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python "${{ matrix.python }}" .venv-ci
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python_bin=".venv-ci/Scripts/python.exe"
          else
            python_bin=".venv-ci/bin/python"
          fi
          uv pip install --python "${python_bin}" packaging
          "${python_bin}" scripts/check_v3_dependency_install.py --python "${python_bin}" --install --check
