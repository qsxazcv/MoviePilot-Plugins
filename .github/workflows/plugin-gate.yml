name: Plugin Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-static-gate:
    name: Repository static gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest packaging

      - name: Validate repository metadata
        run: python scripts/validate_repo.py

      - name: Validate V3 dependency manifests
        run: python scripts/check_v3_dependency_install.py --static-only

      - name: Compile V3 plugins
        shell: bash
        run: |
          set -euo pipefail
          find plugins.v3 -name '*.py' -print0 | xargs -0 -r -n1 python -m py_compile

      - name: Run repository tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

      - name: Build and validate V3 Release archives
        run: python scripts/build_release.py --output dist/releases

      - name: Upload validated Release archives
        uses: actions/upload-artifact@v4
        with:
          name: moviepilot-v3-releases-${{ github.sha }}
          path: dist/releases/*.zip
          if-no-files-found: error

  dependency-install-gate:
    name: V3 dependency resolution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Resolve V3 dependencies without modifying the runner environment
        run: |
          uv venv --python 3.14 .venv-ci
          uv pip install --python .venv-ci/bin/python packaging
          .venv-ci/bin/python scripts/check_v3_dependency_install.py --python .venv-ci/bin/python
